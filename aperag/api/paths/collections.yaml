graph_suggestion_action:
  post:
    summary: Accept or reject a merge suggestion
    description: |
      Take action on a persisted graph-curation suggestion.

      - `accept`: call the existing graph merge primitive and mark overlapping
        pending suggestions as superseded.
      - `reject`: mark the suggestion as rejected without mutating graph truth.
    tags:
      - graph
    security:
      - BearerAuth: []
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
        description: Collection ID
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
        description: Suggestion ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/graph.yaml#/suggestionActionRequest'
          examples:
            accept:
              summary: Accept suggestion
              description: Accept the suggestion and perform merge
              value:
                action: "accept"
            reject:
              summary: Reject suggestion
              description: Reject the suggestion without merging
              value:
                action: "reject"
    responses:
      '200':
        description: Action completed successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/graph.yaml#/suggestionActionResponse'
            examples:
              accept_success:
                summary: Accept action successful
                description: Suggestion accepted and merge completed
                value:
                  status: "success"
                  suggestion_id: "gcs_abcd1234efgh5678"
                  action: "accept"
                  suggestion_status: "ACCEPTED"
                  merge_result:
                    target_entity_id: "e_moxiangju"
                    merged_source_ids: ["e_old_bookstore"]
                    description: "墨香居是这条老巷子里唯一的旧书店，经营着各种书籍"
                    source_chunk_ids: ["chunk_1", "chunk_8"]
                    redirected_edges: 5
                    edges_collapsed: 2
              reject_success:
                summary: Reject action successful
                description: Suggestion rejected successfully
                value:
                  status: "success"
                  suggestion_id: "gcs_abcd1234efgh5678"
                  action: "reject"
                  suggestion_status: "REJECTED"
                  merge_result: null
      '400':
        description: Bad request - invalid action or suggestion already processed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '404':
        description: Collection or suggestion not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'

graph_export_kg_eval:
  get:
    summary: Export collection knowledge graph for KG-Eval framework
    description: |
      Export the collection's knowledge graph data in KG-Eval framework format for evaluation.
      
      This endpoint extracts entities, relationships, and optionally source texts from the 
      collection's knowledge graph and formats them according to the KG-Eval evaluation 
      framework structure.
      
      The export includes:
      - Entities with their names, types, and descriptions
      - Relationships between entities with descriptions, keywords, and weights  
      - Source texts that link back to the entities and relationships (optional)
    security:
      - BearerAuth: []
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
        description: Collection ID to export
      - name: sample_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        description: Number of entities to sample for export (default 100000)
      - name: include_source_texts
        in: query
        schema:
          type: boolean
          default: true
        description: Whether to include source texts in the export (default true)
    responses:
      '200':
        description: KG-Eval export data retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: KG-Eval framework format export data
              properties:
                entities:
                  type: array
                  description: List of entities in KG-Eval format
                  items:
                    type: object
                relationships:
                  type: array
                  description: List of relationships in KG-Eval format
                  items:
                    type: object
                source_texts:
                  type: array
                  description: List of source texts with linked entities/edges (optional)
                  items:
                    type: object
      '400':
        description: Invalid parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '404':
        description: Collection not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/failResponse'

