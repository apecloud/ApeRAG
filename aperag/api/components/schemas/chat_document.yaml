ChatDocumentResponse:
  type: object
  properties:
    id:
      type: string
      description: Document ID
    name:
      type: string
      description: Document name
    size:
      type: integer
      description: Document size in bytes
    status:
      type: string
      enum: [UPLOADING, PENDING, RUNNING, COMPLETE, FAILED]
      description: Document processing status
    chat_id:
      type: string
      description: Chat session ID
    message_id:
      type: string
      description: Message ID that the document is associated with
    created:
      type: string
      format: date-time
      description: Creation timestamp
    updated:
      type: string
      format: date-time
      description: Last update timestamp

ChatDocumentList:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/ChatDocumentResponse'
      description: List of chat documents

ChatDocumentUploadRequest:
  type: object
  properties:
    file:
      type: string
      format: binary
      description: Document file to upload
  required:
    - file
