Settings:
  type: object
  properties:
    use_mineru:
      type: boolean
      description: Whether to use MinerU
    mineru_api_token:
      type: string
      description: API token for MinerU
    use_markitdown:
      type: boolean
      description: Whether to use MarkItDown

ParserHealthItem:
  type: object
  properties:
    key:
      type: string
    label:
      type: string
    status:
      type: string
      enum:
        - ok
        - warning
        - error
        - disabled
    detail:
      type: string
  required:
    - key
    - label
    - status
    - detail

ParserSupportTier:
  type: object
  properties:
    key:
      type: string
    label:
      type: string
    category:
      type: string
      enum:
        - official
        - conditional
        - enhanced
        - optional
    parser:
      type: string
    formats:
      type: array
      items:
        type: string
    status:
      type: string
      enum:
        - available
        - limited
        - unavailable
        - disabled
    detail:
      type: string
    requirements:
      type: array
      items:
        type: string
  required:
    - key
    - label
    - category
    - parser
    - formats
    - status
    - detail
    - requirements

ParserHealthReport:
  type: object
  properties:
    default_parser:
      type: string
    parser_order:
      type: array
      items:
        type: string
    available_extensions:
      type: array
      items:
        type: string
    dependencies:
      type: array
      items:
        $ref: '#/ParserHealthItem'
    services:
      type: array
      items:
        $ref: '#/ParserHealthItem'
    support_tiers:
      type: array
      items:
        $ref: '#/ParserSupportTier'
    warnings:
      type: array
      items:
        type: string
    recommendations:
      type: array
      items:
        type: string
  required:
    - default_parser
    - parser_order
    - available_extensions
    - dependencies
    - services
    - support_tiers
    - warnings
    - recommendations
