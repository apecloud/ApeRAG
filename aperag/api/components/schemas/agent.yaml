AgentMessage:
  type: object
  description: Message format for agent-type bots with additional capabilities
  properties:
    query:
      type: string
      description: User query
      example: Tell me about ApeRAG features
    collection:
      $ref: './collection.yaml#/collection'
      description: The collection object to search in
    model_name:
      type: string
      nullable: true
      description: LLM model to use for response generation
      example: gpt-4o-mini
    web_search_enabled:
      type: boolean
      description: Whether to enable web search
      example: true
      default: false
  required:
    - query
    - collection 