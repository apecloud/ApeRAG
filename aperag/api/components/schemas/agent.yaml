AgentMessage:
  type: object
  description: Message format for agent-type bots with additional capabilities
  properties:
    query:
      type: string
      description: User query
      example: Tell me about ApeRAG features
    collections:
      type: array
      items:
        $ref: './collection.yaml#/collection'
      description: List of collection objects to search in
      example:
        - id: col_123
          title: Example Collection
        - id: col_456
          title: Another Collection
    model_name:
      type: string
      nullable: true
      description: LLM model to use for response generation
      example: gpt-4o-mini
    web_search_enabled:
      type: boolean
      description: Whether to enable web search
      example: true
      default: false
  required:
    - query
    - collections 