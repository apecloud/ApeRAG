feedback:
  type: object
  properties:
    type:
      type: string
      enum:
        - good
        - bad
    tag:
      type: string
      enum:
        - Harmful
        - Unsafe
        - Fake
        - Unhelpful
        - Other
    message:
      type: string

turnFeedbackWrite:
  allOf:
    - $ref: '#/feedback'
    - type: object
      required:
        - type

turnFeedback:
  type: object
  properties:
    turn_id:
      type: string
    type:
      type: string
      enum:
        - good
        - bad
    tag:
      type: string
      enum:
        - Harmful
        - Unsafe
        - Fake
        - Unhelpful
        - Other
    message:
      type: string
    created:
      type: string
      format: date-time
    updated:
      type: string
      format: date-time
  required:
    - turn_id
    - type

turnFeedbackList:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/turnFeedback'
  required:
    - items
