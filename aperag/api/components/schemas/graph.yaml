graphNode:
  type: object
  description: Knowledge graph node representing an entity
  properties:
    id:
      type: string
      description: Unique identifier for the node (entity name)
      example: "墨香居"
    labels:
      type: array
      items:
        type: string
      description: Labels associated with the node
      example: ["墨香居"]
    properties:
      type: object
      description: Node properties containing entity metadata
      properties:
        entity_id:
          type: string
          description: Entity identifier
          example: "墨香居"
        entity_type:
          type: string
          description: Type of the entity
          example: "organization"
        description:
          type: string
          description: Description of the entity
          example: "墨香居是这条老巷子里唯一的旧书店，经营着各种书籍，承载了老板李明华的情怀。"
        source_id:
          type: string
          description: Source chunk ID where entity was extracted
          example: "chunk-88845945407136e9498f5f594c8a00c6"
        file_path:
          type: string
          description: Source file path
          example: "story.txt"
        created_at:
          type: integer
          format: int64
          description: Creation timestamp
          example: 1751356233
      additionalProperties: true
  required:
    - id
    - labels
    - properties

graphEdge:
  type: object
  description: Knowledge graph edge representing a relationship
  properties:
    id:
      type: string
      description: Unique identifier for the edge
      example: "墨香居-深夜读书会"
    type:
      type: string
      description: Type of the relationship
      example: "DIRECTED"
      default: "DIRECTED"
    source:
      type: string
      description: Source node ID
      example: "墨香居"
    target:
      type: string
      description: Target node ID
      example: "深夜读书会"
    properties:
      type: object
      description: Edge properties containing relationship metadata
      properties:
        weight:
          type: number
          format: float
          description: Relationship weight/strength
          example: 9.0
        description:
          type: string
          description: Description of the relationship
          example: "深夜读书会是墨香居的新活动，旨在提升书店的活力和吸引顾客。"
        keywords:
          type: string
          description: Keywords associated with the relationship
          example: "书店活力,活动"
        source_id:
          type: string
          description: Source chunk ID where relationship was extracted
          example: "chunk-88845945407136e9498f5f594c8a00c6"
        file_path:
          type: string
          description: Source file path
          example: "story.txt"
        created_at:
          type: integer
          format: int64
          description: Creation timestamp
          example: 1751356233
      additionalProperties: true
  required:
    - id
    - source
    - target
    - properties

knowledgeGraph:
  type: object
  description: Knowledge graph containing nodes and edges
  properties:
    nodes:
      type: array
      items:
        $ref: '#/graphNode'
      description: List of nodes in the knowledge graph
    edges:
      type: array
      items:
        $ref: '#/graphEdge'
      description: List of edges in the knowledge graph
    is_truncated:
      type: boolean
      description: Whether the graph was truncated due to size limits
      example: false
      default: false
  required:
    - nodes
    - edges
    - is_truncated

graphLabelsResponse:
  type: object
  description: Response containing available graph labels
  properties:
    labels:
      type: array
      items:
        type: string
      description: List of available node labels in the knowledge graph
      example: ["墨香居", "李明华", "林晓雯", "深夜读书会"]
  required:
    - labels 

targetEntityDataRequest:
  type: object
  description: Optional target entity configuration. If not specified, auto-select entity with highest degree.
  properties:
    entity_name:
      type: string
      description: Target entity name. If not specified, auto-select entity with highest degree
    entity_type:
      type: string
      description: Entity type for the target entity
    description:
      type: string
      description: Description for the target entity
    source_id:
      type: string
      description: Source ID for the target entity
    file_path:
      type: string
      description: File path for the target entity
  nullable: true

targetEntityDataResponse:
  type: object
  description: Complete data of the target entity after merge
  properties:
    entity_name:
      type: string
      description: The entity name that was kept (merge target)
      example: "墨香居"
    entity_type:
      type: string
      description: Entity type of the target entity
      example: "ORGANIZATION"
    description:
      type: string
      description: Merged description of the target entity
      example: "墨香居是这条老巷子里唯一的旧书店，经营着各种书籍，承载了老板李明华的情怀。"
    source_id:
      type: string
      description: Source ID information
      example: "chunk-001,chunk-002"
    file_path:
      type: string
      description: File path information
      example: "story.txt,book.txt"
  required:
    - entity_name
    - entity_type
    - description

nodeMergeRequest:
  type: object
  description: |
    Request to merge multiple graph nodes directly using entity IDs.
  properties:
    entity_ids:
      type: array
      items:
        type: string
      description: List of entity IDs to merge directly
      example: ["墨香居", "书店", "旧书店"]
      minItems: 1
    target_entity_data:
      $ref: '#/targetEntityDataRequest'
  required:
    - entity_ids
  additionalProperties: false
  example:
    entity_ids: ["墨香居", "书店", "旧书店"]

nodeMergeResponse:
  type: object
  description: Response containing node merge results
  properties:
    status:
      type: string
      description: Status of the merge operation
      example: "success"
      enum: ["success", "error"]
    message:
      type: string
      description: Detailed message about the merge operation
      example: "Successfully merged 2 entities into 墨香居"
    entity_ids:
      type: array
      items:
        type: string
      description: Entity IDs that were merged
      example: ["墨香居", "书店", "旧书店"]
    target_entity_data:
      $ref: '#/targetEntityDataResponse'
    source_entities:
      type: array
      items:
        type: string
      description: List of entities that were merged into the target
      example: ["书店", "旧书店"]
    redirected_edges:
      type: integer
      description: Number of edges that were redirected during merge
      example: 12
      minimum: 0
    merged_description_length:
      type: integer
      description: Length of the merged description
      example: 512
      minimum: 0
    suggestion_id:
      type: string
      description: Suggestion ID if this merge was based on a suggestion
      example: "msug123"
      nullable: true
  required:
    - status
    - message
    - entity_ids
    - target_entity_data
    - source_entities
    - redirected_edges
    - merged_description_length

mergeSuggestionEntity:
  type: object
  description: Snapshot of an entity captured during graph-curation analysis
  properties:
    entity_id:
      type: string
      description: Entity ID
      example: "e_moxiangju"
    entity_name:
      type: string
      description: Entity name
      example: "墨香居"
    entity_type:
      type: string
      description: Entity type
      example: "ORGANIZATION"
    description:
      type: string
      description: Entity description
      example: "这条老巷子里唯一的旧书店"
    source_chunk_count:
      type: integer
      description: Number of source chunks contributing to the entity
      example: 3
      minimum: 0
  required:
    - entity_id
    - entity_name
    - entity_type
    - description
    - source_chunk_count

graphCurationRunSummary:
  type: object
  description: Summary of an asynchronous graph-curation run
  properties:
    id:
      type: string
      description: Run ID
      example: "gcr_abcd1234efgh5678"
    collection_id:
      type: string
      description: Collection ID
      example: "col123"
    status:
      type: string
      enum: ["PENDING", "RUNNING", "COMPLETED", "FAILED"]
      description: Run lifecycle status
      example: "COMPLETED"
    stats:
      type: object
      description: Best-effort execution stats
      additionalProperties: true
    error_message:
      type: string
      description: Failure message if the run failed
      example: "LLM adjudication timed out"
      nullable: true
    created:
      type: string
      format: date-time
      description: Creation timestamp
      example: "2026-04-23T00:00:00Z"
      nullable: true
    updated:
      type: string
      format: date-time
      description: Last update timestamp
      example: "2026-04-23T00:02:00Z"
      nullable: true
    started:
      type: string
      format: date-time
      description: Run start timestamp
      example: "2026-04-23T00:00:05Z"
      nullable: true
    finished:
      type: string
      format: date-time
      description: Run finish timestamp
      example: "2026-04-23T00:02:00Z"
      nullable: true
  required:
    - id
    - collection_id
    - status
    - stats

mergeSuggestionsRequest:
  type: object
  description: Start a new graph-curation analysis run
  additionalProperties: false
  example: {}

mergeSuggestionItem:
  type: object
  description: Persisted merge suggestion produced by graph curation
  properties:
    id:
      type: string
      description: Suggestion ID
      example: "gcs_abcd1234efgh5678"
    run_id:
      type: string
      description: Run that produced this suggestion
      example: "gcr_abcd1234efgh5678"
    collection_id:
      type: string
      description: Collection ID
      example: "col123"
    entity_ids:
      type: array
      items:
        type: string
      description: Entity IDs in the candidate merge set
      example: ["e_moxiangju", "e_old_bookstore"]
    entities:
      type: array
      items:
        $ref: '#/mergeSuggestionEntity'
      description: Entity snapshots captured when the suggestion was generated
    confidence_score:
      type: number
      format: float
      minimum: 0.0
      maximum: 1.0
      description: Aggregated confidence score for this suggestion
      example: 0.91
    target_entity_id:
      type: string
      description: Recommended surviving entity ID if accepted
      example: "e_moxiangju"
    reason:
      type: string
      description: Human-readable explanation from pairwise LLM adjudication
      example: "两个实体都在描述同一家旧书店，名称和上下文高度重合。"
    evidence:
      type: object
      description: Structured supporting evidence used during candidate generation and adjudication
      additionalProperties: true
      nullable: true
    status:
      type: string
      enum: ["PENDING", "ACCEPTED", "REJECTED", "EXPIRED", "SUPERSEDED"]
      description: Status of the suggestion
      example: "PENDING"
    resolution_note:
      type: string
      description: System note describing why the suggestion left pending state
      example: "superseded_by:gcs_other"
      nullable: true
    created:
      type: string
      format: date-time
      description: Creation timestamp
      example: "2026-04-23T00:02:00Z"
      nullable: true
    updated:
      type: string
      format: date-time
      description: Last update timestamp
      example: "2026-04-23T00:05:00Z"
      nullable: true
    operated_at:
      type: string
      format: date-time
      description: User operation timestamp
      example: "2026-04-23T00:05:00Z"
      nullable: true
  required:
    - id
    - run_id
    - collection_id
    - entity_ids
    - entities
    - confidence_score
    - target_entity_id
    - reason
    - status
    - created
    - updated

mergeSuggestionsRunResponse:
  type: object
  description: Response returned when starting a graph-curation analysis run
  properties:
    run:
      $ref: '#/graphCurationRunSummary'
    started:
      type: boolean
      description: Whether a new run was actually scheduled
      example: true
    message:
      type: string
      description: Human-readable status message
      example: "Graph curation run started"
  required:
    - run
    - started
    - message

mergeSuggestionsResponse:
  type: object
  description: Latest persisted graph-curation run and its suggestions
  properties:
    run:
      $ref: '#/graphCurationRunSummary'
      nullable: true
    suggestions:
      type: array
      items:
        $ref: '#/mergeSuggestionItem'
      description: Suggestions from the latest run, ordered by confidence score
  required:
    - run
    - suggestions

suggestionActionRequest:
  type: object
  description: Request to take action on a merge suggestion
  properties:
    action:
      type: string
      enum: ["accept", "reject"]
      description: Action to take on the suggestion (case-insensitive, e.g., 'Accept', 'REJECT', 'accept')
      example: "accept"
  required:
    - action
  additionalProperties: false
  example:
    action: "accept"

suggestionActionMergeResult:
  type: object
  description: Merge result returned when a suggestion is accepted
  properties:
    target_entity_id:
      type: string
      description: Surviving entity ID after merge
      example: "e_moxiangju"
    merged_source_ids:
      type: array
      items:
        type: string
      description: Merged-away entity IDs
      example: ["e_old_bookstore"]
    description:
      type: string
      description: Merged description of the surviving entity
    source_chunk_ids:
      type: array
      items:
        type: string
      description: Source chunk IDs preserved on the surviving entity
      example: ["chunk_1", "chunk_8"]
    edges_redirected:
      type: integer
      description: Number of redirected edges
      example: 5
      minimum: 0
    edges_collapsed:
      type: integer
      description: Number of duplicate edges collapsed
      example: 2
      minimum: 0
  required:
    - target_entity_id
    - merged_source_ids
    - description
    - source_chunk_ids
    - edges_redirected
    - edges_collapsed

suggestionActionResponse:
  type: object
  description: Response containing suggestion action results
  properties:
    status:
      type: string
      description: Status of the action operation
      example: "success"
      enum: ["success", "error"]
    suggestion_id:
      type: string
      description: The suggestion ID that was processed
      example: "msug123"
    action:
      type: string
      enum: ["accept", "reject"]
      description: The action that was performed (normalized to lowercase)
      example: "accept"
    suggestion_status:
      type: string
      enum: ["ACCEPTED", "REJECTED"]
      description: Suggestion status after processing the action
      example: "ACCEPTED"
    merge_result:
      $ref: '#/suggestionActionMergeResult'
      description: Merge operation result (only present when action is 'accept')
      nullable: true
  required:
    - status
    - suggestion_id
    - action
    - suggestion_status
