name: Unit-Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.11"

      - name: Install dependencies
        run: |
          make env-install

      - name: Run lint
        run: |
          make lint

      - name: Run unit tests with coverage
        run: |
          make test-unit

      - name: Upload unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            tests/report/unit-coverage.xml
            tests/report/unit-coverage.json
          if-no-files-found: error
