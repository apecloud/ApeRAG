name: Unit-Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aperag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aperag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aperag
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.11"

      - name: Install dependencies
        run: |
          make env-install

      - name: Apply migrations
        run: |
          make db-migrate

      - name: Alembic drift check
        run: |
          make db-check

      - name: Run lint
        run: |
          make lint

      - name: Check code-first OpenAPI export
        run: |
          make openapi-check

      - name: Run unit tests with coverage
        run: |
          make test-unit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Frontend type-check
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn type-check

      - name: Upload unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            tests/report/unit-coverage.xml
            tests/report/unit-coverage.json
          if-no-files-found: error
