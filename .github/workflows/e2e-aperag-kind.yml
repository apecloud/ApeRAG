name: E2E ApeRAG on Kind

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-aperag-kind.yml"
      - ".github/workflows/e2e-aperag-test.yml"
      - "deploy/**"
      - "tests/e2e_http/**"
      - "Dockerfile"
      - "aperag/**"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Which K8s-backed HTTP suite to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
          - all

run-name: >
  Kind E2E:${{ github.event_name == 'pull_request' && 'smoke' || inputs.test_scope }}
  sha=${{ github.sha }}

permissions:
  contents: read

env:
  HELM_VERSION: "v3.12.0"
  HURL_VERSION: "7.1.0"
  KIND_VERSION: "v0.29.0"
  KIND_CLUSTER_NAME: "aperag-e2e"
  DATABASE_PROFILE: "kind"

jobs:
  e2e-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.test_scope }}
      E2E_ALIBABACLOUD_API_KEY: ${{ secrets.E2E_ALIBABACLOUD_API_KEY }}
      E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind --version

      - name: Install Hurl
        run: |
          curl -fsSL -o /tmp/hurl.tar.gz "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/hurl.tar.gz -C /tmp
          sudo mv /tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl /usr/local/bin/hurl
          hurl --version

      - name: Create Kind cluster
        run: |
          kind create cluster --name "${KIND_CLUSTER_NAME}" --wait 180s
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Ensure default storage class
        run: |
          if kubectl get storageclass | grep -q "(default)"; then
            kubectl get storageclass
            exit 0
          fi

          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
          kubectl -n local-path-storage wait --for=condition=available deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          kubectl get storageclass

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          provenance: false
          platforms: linux/amd64
          tags: apecloud/aperag:kind-e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Load backend image into Kind
        run: |
          kind load docker-image "apecloud/aperag:kind-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --name "${KIND_CLUSTER_NAME}"

      - name: Install KubeBlocks prerequisites and addons
        run: |
          chmod +x ./deploy/databases/01-prepare.sh
          ./deploy/databases/01-prepare.sh

      - name: Install databases
        run: |
          chmod +x ./deploy/databases/02-install-database.sh
          ./deploy/databases/02-install-database.sh
          kubectl get pods -n default -o wide

      - name: Deploy ApeRAG from current ref images
        run: |
          helm upgrade --install aperag ./deploy/aperag \
            --set image.repository="apecloud/aperag" \
            --set image.tag="kind-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --set image.pullPolicy=IfNotPresent \
            --set frontend.replicaCount=0 \
            --wait --timeout=20m

      - name: Wait for ApeRAG pods
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=aperag -n default --timeout=900s
          kubectl get pods -n default -o wide
          kubectl get svc -n default

      - name: Check provider secrets
        id: provider-secrets
        if: ${{ env.TEST_SCOPE != 'smoke' }}
        shell: bash
        run: |
          if [[ -n "${E2E_ALIBABACLOUD_API_KEY}" && -n "${E2E_OPENROUTER_API_KEY}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${TEST_SCOPE}" == "full" ]]; then
            echo "Missing E2E_ALIBABACLOUD_API_KEY or E2E_OPENROUTER_API_KEY" >&2
            exit 1
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping provider-aware suite because required secrets are missing."
          fi

      - name: Run Kind smoke HTTP suite
        if: ${{ env.TEST_SCOPE == 'smoke' || env.TEST_SCOPE == 'all' }}
        env:
          E2E_K8S_NAMESPACE: default
          E2E_K8S_SERVICE: aperag
        run: |
          make test-http-smoke-k8s

      - name: Run Kind provider-aware HTTP suite
        if: ${{ env.TEST_SCOPE == 'full' || (env.TEST_SCOPE == 'all' && steps.provider-secrets.outputs.available == 'true') }}
        env:
          E2E_K8S_NAMESPACE: default
          E2E_K8S_SERVICE: aperag
        run: |
          make test-http-full-k8s

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide || true
          echo "=== Storage Classes ==="
          kubectl get storageclass || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== Clusters ==="
          kubectl get clusters --all-namespaces || true
          echo "=== KubeBlocks CRDs ==="
          kubectl get crd | grep kubeblocks || true
          echo "=== Services ==="
          kubectl get svc --all-namespaces || true
          echo "=== Events ==="
          kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp || true
          echo "=== Helm releases ==="
          helm list -A || true
          echo "=== ApeRAG pod logs ==="
          for pod in $(kubectl get pods -n default -l app.kubernetes.io/instance=aperag -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for ${pod} ---"
            kubectl logs -n default "${pod}" --all-containers --tail=200 || true
          done

      - name: Delete Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
