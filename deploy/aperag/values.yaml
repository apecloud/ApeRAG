image:
  repository: "docker.io/apecloud/aperag"  # Full image name including registry
  tag: "v0.0.0-nightly"
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

service:
  type: ClusterIP

ingress:
  className: ""
  annotations: {}

postgres:
  enabled: true  # Enable/disable PostgreSQL database integration
  POSTGRES_HOST: "pg-cluster-postgresql-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "postgres"
  # The name of the Secret containing PostgreSQL username and password (e.g., "username" and "password" keys).
  # Example: "pg-cluster-postgresql-account-postgres" (references your Kubeblocks credential Secret)
  POSTGRES_CREDENTIALS_SECRET_NAME: "pg-cluster-postgresql-account-postgres"
  # Username and Password Priority:
  # 1. If POSTGRES_CREDENTIALS_SECRET_NAME is set, attempts to fetch 'username' and 'password' from that Secret.
  # 2. If POSTGRES_CREDENTIALS_SECRET_NAME is empty, uses the direct values of POSTGRES_USER and POSTGRES_PASSWORD.
  # 3. If direct values are also empty, defaults to "postgres" for user or forces a failure for password.
  # ⚠️ Recommend to use POSTGRES_CREDENTIALS_SECRET_NAME
  POSTGRES_USER: "postgres" # Default PostgreSQL user
  # Password (Sensitive information, strongly recommended NOT to set directly in values.yaml):
  # Only use this if you are NOT using POSTGRES_CREDENTIALS_SECRET_NAME and accept the security implications.
  # ⚠️ Strongly discourage directly setting sensitive passwords here. Use Secrets for production.
  # ⚠️ Recommend to use POSTGRES_CREDENTIALS_SECRET_NAME
  POSTGRES_PASSWORD: ""

redis:
  enabled: true  # Enable/disable Redis database integration
  REDIS_HOST: "redis-cluster-redis-redis"
  REDIS_PORT: "6379"
  # The name of the Secret containing Redis credentials (e.g., "password" key).
  # Example: "redis-cluster-redis-account-default"
  REDIS_CREDENTIALS_SECRET_NAME: "redis-cluster-redis-account-default" # Or your actual Redis secret name
  # User for Redis connection. Default: "default"
  # ⚠️ Recommend to use REDIS_CREDENTIALS_SECRET_NAME
  REDIS_USER: "default"
  # Password for Redis connection.
  # ⚠️ Strongly discourage directly setting sensitive passwords here. Use Secrets for production.
  # ⚠️ Recommend to use REDIS_CREDENTIALS_SECRET_NAME
  REDIS_PASSWORD: "redis"

elasticsearch:
  enabled: true  # Enable/disable Elasticsearch integration (used for hybrid search)
  # Hostname for the Elasticsearch HTTP service.
  # Default: "es-cluster-mdit-http" (Kubeblocks Elasticsearch SVC name)
  ES_HOST: "es-cluster-mdit-http"
  # Port for the Elasticsearch HTTP service. Default: "9200"
  ES_PORT: "9200"
  # Protocol for Elasticsearch connection. Default: "http" or "https"
  ES_PROTOCOL: "http"
  # The name of the Secret containing Elasticsearch credentials (e.g., "username" and "password" keys).
  # Example: "es-cluster-mdit-account-default"
  ES_CREDENTIALS_SECRET_NAME: "" # Fill this if you have an ES secret
  # User for Elasticsearch connection (if authentication is enabled).
  # ⚠️ Recommend to use ES_CREDENTIALS_SECRET_NAME
  ES_USER: ""
  # Password for Elasticsearch connection (if authentication is enabled).
  # ⚠️ Strongly discourage directly setting sensitive passwords here. Use Secrets for production.
  # ⚠️ Recommend to use ES_CREDENTIALS_SECRET_NAME
  ES_PASSWORD: ""

neo4j:
  enabled: false  # Enable/disable Neo4j graph database integration (optional for graph features)
  # Bolt URI for the Neo4j service.
  # Default: "bolt://neo4j-cluster-neo4j:7687" (Kubeblocks Neo4j SVC name)
  NEO4J_URI: "bolt://neo4j-cluster-neo4j:7687"
  # The name of the Secret containing Neo4j username and password (e.g., "username" and "password" keys).
  # Example: "neo4j-cluster-neo4j-account-neo4j" (references your Kubeblocks credential Secret)
  NEO4J_CREDENTIALS_SECRET_NAME: "neo4j-cluster-neo4j-account-neo4j"
  # Username and Password Priority:
  # 1. If NEO4J_CREDENTIALS_SECRET_NAME is set, attempts to fetch 'username' and 'password' from that Secret.
  # 2. If NEO4J_CREDENTIALS_SECRET_NAME is empty, uses the direct values of NEO4J_USERNAME and NEO4J_PASSWORD.
  # 3. If direct values are also empty, defaults to "neo4j" for user or forces a failure for password.
  # ⚠️ Recommend to use NEO4J_CREDENTIALS_SECRET_NAME
  NEO4J_USERNAME: "neo4j" # Default Neo4j user
  # Password (Sensitive information, strongly recommended NOT to set directly in values.yaml):
  # Only use this if you are NOT using NEO4J_CREDENTIALS_SECRET_NAME and accept the security implications.
  # ⚠️ Strongly discourage directly setting sensitive passwords here. Use Secrets for production.
  # ⚠️ Recommend to use NEO4J_CREDENTIALS_SECRET_NAME
  NEO4J_PASSWORD: ""

api:
  dataPath: /data/aperag
  replicaCount: 1
  # Helm-level role-specific database pool budget for the API deployment.
  # These values map to the existing application env names DB_POOL_SIZE and
  # DB_MAX_OVERFLOW through aperag-secret.yaml. Keep this budget separate
  # from indexingWorker.* to avoid API/worker replica rollouts exhausting
  # PostgreSQL max_connections.
  dbPoolSize: "5"
  dbMaxOverflow: "5"
  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # task #17: API and indexing execution plane are hard-cut. API pods
  # handle HTTP and enqueue only; indexing workers, reconciler, and cleanup
  # loops run in indexingWorker pods. The soft anti-affinity for spreading
  # API replicas across nodes is preserved.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.aperag.io/component: api
            topologyKey: kubernetes.io/hostname
  env:
    # Auth
    JWT_SECRET: "a-very-secret-key-that-you-should-change" # IMPORTANT: Change this in production
    OAUTH_REDIRECT_URL: "http://127.0.0.1:3000/web/oauth-callback.html"
    GOOGLE_OAUTH_CLIENT_ID: ""
    GOOGLE_OAUTH_CLIENT_SECRET: ""
    GITHUB_OAUTH_CLIENT_ID: ""
    GITHUB_OAUTH_CLIENT_SECRET: ""
    AUTH_TYPE: cookie
    AUTH0_DOMAIN: ""
    AUTH0_CLIENT_ID: ""
    AUTHING_DOMAIN: ""
    AUTHING_APP_ID: ""
    LOGTO_DOMAIN: ""
    LOGTO_APP_ID: ""
    REGISTER_MODE: unlimited

    # Database connection pool
    DB_POOL_SIZE: "20"
    DB_MAX_OVERFLOW: "40"
    DB_POOL_TIMEOUT: "60"
    DB_POOL_RECYCLE: "3600"
    DB_POOL_PRE_PING: "True"
    DATABASE_URL: ""

    # Indexing runtime
    INDEXING_MODE: async
    INDEXING_QUEUE_BACKEND: redis
    INDEXING_QUEUE_REDIS_URL: ""
    INDEXING_METRICS_EMITTER: noop
    INDEXING_QUOTA_BACKEND: redis
    INDEXING_QUOTA_REDIS_URL: ""
    LOCAL_QUEUE_NAME: ""
    MEMORY_REDIS_URL: ""

    # Vector DB
    VECTOR_DB_TYPE: qdrant
    VECTOR_DB_CONTEXT: '{"url":"http://qdrant-cluster-qdrant-qdrant", "port":6333, "distance":"Cosine", "timeout": 1000}'
    # Qdrant multitenancy + memory-optimization defaults.
    # Switch QDRANT_MULTITENANT to "False" to fall back to the legacy
    # one-collection-per-ApeRAG-collection layout (for rollback only).
    QDRANT_MULTITENANT: "True"
    QDRANT_QUANTIZATION_ENABLED: "True"
    QDRANT_QUANTIZATION_TYPE: "int8"
    QDRANT_QUANTIZATION_QUANTILE: "0.99"
    QDRANT_QUANTIZATION_ALWAYS_RAM: "True"
    QDRANT_HNSW_ON_DISK: "True"
    QDRANT_DEFAULT_SEGMENT_NUMBER: "2"
    QDRANT_MMAP_THRESHOLD_KB: "20480"
    QDRANT_VECTORS_ON_DISK: "True"
    QDRANT_ON_DISK_PAYLOAD: "True"
    # pgvector knobs. Leave PGVECTOR_DATABASE_URL empty to reuse the
    # main ApeRAG PostgreSQL (recommended for small-to-medium private
    # deployments — one fewer component to operate). Switch by setting
    # VECTOR_DB_TYPE=pgvector. Refer to docs/zh-CN/design/
    # vector_db_abstraction.md for sizing / trade-off guidance.
    PGVECTOR_DATABASE_URL: ""
    PGVECTOR_HNSW_M: "16"
    PGVECTOR_HNSW_EF_CONSTRUCTION: "64"
    PGVECTOR_HNSW_EF_SEARCH: "40"

    # Fulltext search
    ES_HOST: ""
    ES_TIMEOUT: "30"
    ES_MAX_RETRIES: "3"
    ES_FULLTEXT_NUMBER_OF_SHARDS: "1"
    ES_FULLTEXT_NUMBER_OF_REPLICAS: "0"

    # Object Store
    OBJECT_STORE_TYPE: local
    OBJECT_STORE_LOCAL_ROOT_DIR: /data/objects
    OBJECT_STORE_S3_ENDPOINT: ""
    OBJECT_STORE_S3_REGION: ""
    OBJECT_STORE_S3_ACCESS_KEY: ""
    OBJECT_STORE_S3_SECRET_KEY: ""
    OBJECT_STORE_S3_BUCKET: aperag
    OBJECT_STORE_S3_PREFIX_PATH: ""
    OBJECT_STORE_S3_USE_PATH_STYLE: "True"

    DEBUG: "False"
    MAX_BOT_COUNT: 10
    MAX_COLLECTION_COUNT: 20
    MAX_DOCUMENT_COUNT: 4000
    MAX_DOCUMENT_COUNT_PER_COLLECTION: 200
    MAX_DOCUMENT_SIZE: "104857600"
    MAX_CONVERSATION_COUNT: 100
    EMBEDDING_MAX_CHUNKS_IN_BATCH: 10
    EMBEDDING_MAX_WORKERS: 1
    # Chunking
    CHUNK_SIZE: 400
    CHUNK_OVERLAP_SIZE: 20
    TIKTOKEN_CACHE_DIR: /root/.cache/tiktoken
    DEFAULT_ENCODING_MODEL: cl100k_base
    TOKENIZERS_PARALLELISM: "false"

    # Graph DB backend
    GRAPH_DB_TYPE: postgresql
    NEO4J_URI: ""
    NEO4J_USERNAME: "neo4j"
    NEO4J_PASSWORD: ""
    NEBULA_HOSTS: ""
    NEBULA_USERNAME: "root"
    NEBULA_PASSWORD: "nebula"
    NEBULA_SPACE_PREFIX: "aperag"

    # Cache
    CACHE_ENABLED: "True"
    CACHE_TTL: "86400"
    CACHE_REDIS_URL: ""
    CACHE_LLM_TTL_SECONDS: ""
    CACHE_EMBEDDING_TTL_SECONDS: ""
    CACHE_RERANK_TTL_SECONDS: ""
    CACHE_WEB_SEARCH_TTL_SECONDS: "600"
    CACHE_WEB_READ_TTL_SECONDS: "3600"
    CACHE_PARSER_PREFLIGHT_TTL_SECONDS: "60"
    CACHE_REMOTE_PARSER_TTL_SECONDS: "604800"
    CACHE_MAX_VALUE_BYTES: "8388608"
    READ_PRIMITIVE_CACHE_L1_SIZE: "256"
    READ_PRIMITIVE_CACHE_L2_TTL_SECONDS: "3600"

    # LLM Keyword Extraction
    LLM_KEYWORD_EXTRACTION_PROVIDER: "openrouter"
    LLM_KEYWORD_EXTRACTION_MODEL: "google/gemini-2.5-flash"

    # Optional parser integrations
    WHISPER_HOST: ""
    PADDLEOCR_HOST: ""

    # Observability: local mode emits structured logs with trace correlation
    # and does not require any extra observability system. Set mode to "otlp"
    # or "collector" plus OTEL_EXPORTER_OTLP_ENDPOINT to export telemetry.
    APERAG_OBSERVABILITY_MODE: local
    APERAG_OBSERVABILITY_LOG_FORMAT: json
    APERAG_OBSERVABILITY_CAPTURE_CONTENT: "False"
    APERAG_OBSERVABILITY_SAMPLE_RATIO: "1.0"
    OTEL_ENABLED: ""
    OTEL_SERVICE_NAME: aperag
    OTEL_SERVICE_VERSION: "1.0.0"
    OTEL_ENVIRONMENT: production
    OTEL_RESOURCE_ATTRIBUTES: ""
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_EXPORTER_OTLP_HEADERS: ""
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_CONSOLE_ENABLED: "False"
    OTEL_FASTAPI_ENABLED: "True"
    OTEL_SQLALCHEMY_ENABLED: "True"
    OTEL_MCP_ENABLED: "True"

    # Evaluation concurrency
    MAX_CONCURRENT_EVALUATIONS: "5"
    MAX_CONCURRENT_PROCESSING_TASKS_PER_EVALUATION: "5"
    EVALUATION_ITEM_PROCESSING_TASK_TIMEOUT_MINUTES: "15"

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

# task #17: ``api`` and ``indexingWorker`` use separate DB pool budgets.
# Before raising replica counts, verify:
#   sum(replicas * (pool_size + max_overflow)) + rollout_surge_budget
#     + diagnostics_reserved + postgres_reserved
#     < postgres_max_connections * safety_ratio
# PgBouncer is a future infrastructure option and does not remove this
# budgeting requirement.
indexingWorker:
  enabled: true
  replicaCount: 1
  # Maps to existing DB_POOL_SIZE / DB_MAX_OVERFLOW env names in the worker
  # container. Do not add application-level API_DB_POOL_SIZE or
  # INDEXING_WORKER_DB_POOL_SIZE aliases.
  dbPoolSize: "10"
  dbMaxOverflow: "10"
  resources: {}
  affinity: {}
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f "aperag.cli.indexing_worker" >/dev/null
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: "docker.io/apecloud/aperag-frontend"  # Full image name including registry
    tag: "v0.0.0-nightly"
    pullPolicy: IfNotPresent
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
  affinity: {}
  # Frontend configuration values for settings.js
  title: "ApeRAG"
  favicon: ""
  logoDark: ""
  logoLight: ""
  github: "https://github.com/apecloud/ApeRAG"
  publicIps: []
