apiVersion: v1
kind: Secret
metadata:
  name: aperag-env
  labels:
    {{- include "aperag.labels" . | nindent 4 }}
type: Opaque
stringData:
  .env: |
    # Auth
    JWT_SECRET={{ .Values.api.env.JWT_SECRET }}
    AUTH_TYPE={{ .Values.api.env.AUTH_TYPE }}
    OAUTH_REDIRECT_URL={{ .Values.api.env.OAUTH_REDIRECT_URL }}
    GOOGLE_OAUTH_CLIENT_ID={{ .Values.api.env.GOOGLE_OAUTH_CLIENT_ID }}
    GOOGLE_OAUTH_CLIENT_SECRET={{ .Values.api.env.GOOGLE_OAUTH_CLIENT_SECRET }}
    GITHUB_OAUTH_CLIENT_ID={{ .Values.api.env.GITHUB_OAUTH_CLIENT_ID }}
    GITHUB_OAUTH_CLIENT_SECRET={{ .Values.api.env.GITHUB_OAUTH_CLIENT_SECRET }}
    AUTH0_DOMAIN={{ .Values.api.env.AUTH0_DOMAIN }}
    AUTH0_CLIENT_ID={{ .Values.api.env.AUTH0_CLIENT_ID }}
    AUTHING_DOMAIN={{ .Values.api.env.AUTHING_DOMAIN }}
    AUTHING_APP_ID={{ .Values.api.env.AUTHING_APP_ID }}
    LOGTO_DOMAIN={{ .Values.api.env.LOGTO_DOMAIN }}
    LOGTO_APP_ID={{ .Values.api.env.LOGTO_APP_ID }}
    REGISTER_MODE={{ .Values.api.env.REGISTER_MODE }}

    # Database connection pool
    DB_POOL_SIZE={{ .Values.api.dbPoolSize | default .Values.api.env.DB_POOL_SIZE }}
    DB_MAX_OVERFLOW={{ .Values.api.dbMaxOverflow | default .Values.api.env.DB_MAX_OVERFLOW }}
    DB_POOL_TIMEOUT={{ .Values.api.env.DB_POOL_TIMEOUT }}
    DB_POOL_RECYCLE={{ .Values.api.env.DB_POOL_RECYCLE }}
    DB_POOL_PRE_PING={{ .Values.api.env.DB_POOL_PRE_PING }}
    DATABASE_URL={{ .Values.api.env.DATABASE_URL }}

    # Indexing runtime
    INDEXING_MODE={{ .Values.api.env.INDEXING_MODE }}
    INDEXING_QUEUE_BACKEND={{ .Values.api.env.INDEXING_QUEUE_BACKEND }}
    INDEXING_QUEUE_REDIS_URL={{ .Values.api.env.INDEXING_QUEUE_REDIS_URL }}
    INDEXING_METRICS_EMITTER={{ .Values.api.env.INDEXING_METRICS_EMITTER }}
    INDEXING_QUOTA_BACKEND={{ .Values.api.env.INDEXING_QUOTA_BACKEND }}
    INDEXING_QUOTA_REDIS_URL={{ .Values.api.env.INDEXING_QUOTA_REDIS_URL }}
    LOCAL_QUEUE_NAME={{ .Values.api.env.LOCAL_QUEUE_NAME }}
    MEMORY_REDIS_URL={{ .Values.api.env.MEMORY_REDIS_URL }}

    # Vector DB
    VECTOR_DB_TYPE={{ .Values.api.env.VECTOR_DB_TYPE }}
    VECTOR_DB_CONTEXT={{ .Values.api.env.VECTOR_DB_CONTEXT }}
    QDRANT_MULTITENANT={{ .Values.api.env.QDRANT_MULTITENANT }}
    QDRANT_QUANTIZATION_ENABLED={{ .Values.api.env.QDRANT_QUANTIZATION_ENABLED }}
    QDRANT_QUANTIZATION_TYPE={{ .Values.api.env.QDRANT_QUANTIZATION_TYPE }}
    QDRANT_QUANTIZATION_QUANTILE={{ .Values.api.env.QDRANT_QUANTIZATION_QUANTILE }}
    QDRANT_QUANTIZATION_ALWAYS_RAM={{ .Values.api.env.QDRANT_QUANTIZATION_ALWAYS_RAM }}
    QDRANT_HNSW_ON_DISK={{ .Values.api.env.QDRANT_HNSW_ON_DISK }}
    QDRANT_DEFAULT_SEGMENT_NUMBER={{ .Values.api.env.QDRANT_DEFAULT_SEGMENT_NUMBER }}
    QDRANT_MMAP_THRESHOLD_KB={{ .Values.api.env.QDRANT_MMAP_THRESHOLD_KB }}
    QDRANT_VECTORS_ON_DISK={{ .Values.api.env.QDRANT_VECTORS_ON_DISK }}
    QDRANT_ON_DISK_PAYLOAD={{ .Values.api.env.QDRANT_ON_DISK_PAYLOAD }}
    PGVECTOR_DATABASE_URL={{ .Values.api.env.PGVECTOR_DATABASE_URL }}
    PGVECTOR_HNSW_M={{ .Values.api.env.PGVECTOR_HNSW_M }}
    PGVECTOR_HNSW_EF_CONSTRUCTION={{ .Values.api.env.PGVECTOR_HNSW_EF_CONSTRUCTION }}
    PGVECTOR_HNSW_EF_SEARCH={{ .Values.api.env.PGVECTOR_HNSW_EF_SEARCH }}

    # Fulltext search
    ES_HOST={{ .Values.api.env.ES_HOST }}
    ES_TIMEOUT={{ .Values.api.env.ES_TIMEOUT }}
    ES_MAX_RETRIES={{ .Values.api.env.ES_MAX_RETRIES }}
    ES_FULLTEXT_NUMBER_OF_SHARDS={{ .Values.api.env.ES_FULLTEXT_NUMBER_OF_SHARDS }}
    ES_FULLTEXT_NUMBER_OF_REPLICAS={{ .Values.api.env.ES_FULLTEXT_NUMBER_OF_REPLICAS }}

    # Object Store
    OBJECT_STORE_TYPE={{ .Values.api.env.OBJECT_STORE_TYPE }}
    {{- if eq .Values.api.env.OBJECT_STORE_TYPE "local" }}
    OBJECT_STORE_LOCAL_ROOT_DIR={{ .Values.api.env.OBJECT_STORE_LOCAL_ROOT_DIR }}
    {{- end }}
    {{- if eq .Values.api.env.OBJECT_STORE_TYPE "s3" }}
    OBJECT_STORE_S3_ENDPOINT={{ .Values.api.env.OBJECT_STORE_S3_ENDPOINT }}
    OBJECT_STORE_S3_REGION={{ .Values.api.env.OBJECT_STORE_S3_REGION }}
    OBJECT_STORE_S3_ACCESS_KEY={{ .Values.api.env.OBJECT_STORE_S3_ACCESS_KEY }}
    OBJECT_STORE_S3_SECRET_KEY={{ .Values.api.env.OBJECT_STORE_S3_SECRET_KEY }}
    OBJECT_STORE_S3_BUCKET={{ .Values.api.env.OBJECT_STORE_S3_BUCKET }}
    OBJECT_STORE_S3_PREFIX_PATH={{ .Values.api.env.OBJECT_STORE_S3_PREFIX_PATH }}
    OBJECT_STORE_S3_USE_PATH_STYLE={{ .Values.api.env.OBJECT_STORE_S3_USE_PATH_STYLE }}
    {{- end }}

    DEBUG={{ .Values.api.env.DEBUG }}

    MAX_BOT_COUNT={{ .Values.api.env.MAX_BOT_COUNT }}
    MAX_COLLECTION_COUNT={{ .Values.api.env.MAX_COLLECTION_COUNT }}
    MAX_DOCUMENT_COUNT={{ .Values.api.env.MAX_DOCUMENT_COUNT }}
    MAX_DOCUMENT_COUNT_PER_COLLECTION={{ .Values.api.env.MAX_DOCUMENT_COUNT_PER_COLLECTION }}
    MAX_DOCUMENT_SIZE={{ .Values.api.env.MAX_DOCUMENT_SIZE }}
    MAX_CONVERSATION_COUNT={{ .Values.api.env.MAX_CONVERSATION_COUNT }}

    EMBEDDING_MAX_CHUNKS_IN_BATCH={{ .Values.api.env.EMBEDDING_MAX_CHUNKS_IN_BATCH }}
    EMBEDDING_MAX_WORKERS={{ .Values.api.env.EMBEDDING_MAX_WORKERS }}

    # Chunking
    CHUNK_SIZE={{ .Values.api.env.CHUNK_SIZE }}
    CHUNK_OVERLAP_SIZE={{ .Values.api.env.CHUNK_OVERLAP_SIZE }}

    TIKTOKEN_CACHE_DIR={{ .Values.api.env.TIKTOKEN_CACHE_DIR }}
    DEFAULT_ENCODING_MODEL={{ .Values.api.env.DEFAULT_ENCODING_MODEL }}
    TOKENIZERS_PARALLELISM={{ .Values.api.env.TOKENIZERS_PARALLELISM }}

    # Graph DB
    GRAPH_DB_TYPE={{ .Values.api.env.GRAPH_DB_TYPE }}
    NEO4J_URI={{ .Values.api.env.NEO4J_URI }}
    NEO4J_USERNAME={{ .Values.api.env.NEO4J_USERNAME }}
    NEO4J_PASSWORD={{ .Values.api.env.NEO4J_PASSWORD }}
    NEBULA_HOSTS={{ .Values.api.env.NEBULA_HOSTS }}
    NEBULA_USERNAME={{ .Values.api.env.NEBULA_USERNAME }}
    NEBULA_PASSWORD={{ .Values.api.env.NEBULA_PASSWORD }}
    NEBULA_SPACE_PREFIX={{ .Values.api.env.NEBULA_SPACE_PREFIX }}

    # Cache
    CACHE_ENABLED={{ .Values.api.env.CACHE_ENABLED }}
    CACHE_TTL={{ .Values.api.env.CACHE_TTL }}
    CACHE_REDIS_URL={{ .Values.api.env.CACHE_REDIS_URL }}
    CACHE_LLM_TTL_SECONDS={{ .Values.api.env.CACHE_LLM_TTL_SECONDS }}
    CACHE_EMBEDDING_TTL_SECONDS={{ .Values.api.env.CACHE_EMBEDDING_TTL_SECONDS }}
    CACHE_WEB_SEARCH_TTL_SECONDS={{ .Values.api.env.CACHE_WEB_SEARCH_TTL_SECONDS }}
    CACHE_WEB_READ_TTL_SECONDS={{ .Values.api.env.CACHE_WEB_READ_TTL_SECONDS }}
    CACHE_PARSER_PREFLIGHT_TTL_SECONDS={{ .Values.api.env.CACHE_PARSER_PREFLIGHT_TTL_SECONDS }}
    CACHE_REMOTE_PARSER_TTL_SECONDS={{ .Values.api.env.CACHE_REMOTE_PARSER_TTL_SECONDS }}
    CACHE_MAX_VALUE_BYTES={{ .Values.api.env.CACHE_MAX_VALUE_BYTES }}
    READ_PRIMITIVE_CACHE_L1_SIZE={{ .Values.api.env.READ_PRIMITIVE_CACHE_L1_SIZE }}
    READ_PRIMITIVE_CACHE_L2_TTL_SECONDS={{ .Values.api.env.READ_PRIMITIVE_CACHE_L2_TTL_SECONDS }}

    # LLM Keyword Extraction
    LLM_KEYWORD_EXTRACTION_PROVIDER={{ .Values.api.env.LLM_KEYWORD_EXTRACTION_PROVIDER }}
    LLM_KEYWORD_EXTRACTION_MODEL={{ .Values.api.env.LLM_KEYWORD_EXTRACTION_MODEL }}

    # Optional parser integrations
    WHISPER_HOST={{ .Values.api.env.WHISPER_HOST }}
    PADDLEOCR_HOST={{ .Values.api.env.PADDLEOCR_HOST }}

    # Observability
    APERAG_OBSERVABILITY_MODE={{ .Values.api.env.APERAG_OBSERVABILITY_MODE }}
    APERAG_OBSERVABILITY_LOG_FORMAT={{ .Values.api.env.APERAG_OBSERVABILITY_LOG_FORMAT }}
    APERAG_OBSERVABILITY_CAPTURE_CONTENT={{ .Values.api.env.APERAG_OBSERVABILITY_CAPTURE_CONTENT }}
    APERAG_OBSERVABILITY_SAMPLE_RATIO={{ .Values.api.env.APERAG_OBSERVABILITY_SAMPLE_RATIO }}
    OTEL_ENABLED={{ .Values.api.env.OTEL_ENABLED }}
    OTEL_SERVICE_NAME={{ .Values.api.env.OTEL_SERVICE_NAME }}
    OTEL_SERVICE_VERSION={{ .Values.api.env.OTEL_SERVICE_VERSION }}
    OTEL_ENVIRONMENT={{ .Values.api.env.OTEL_ENVIRONMENT }}
    OTEL_RESOURCE_ATTRIBUTES={{ .Values.api.env.OTEL_RESOURCE_ATTRIBUTES }}
    OTEL_EXPORTER_OTLP_ENDPOINT={{ .Values.api.env.OTEL_EXPORTER_OTLP_ENDPOINT }}
    OTEL_EXPORTER_OTLP_HEADERS={{ .Values.api.env.OTEL_EXPORTER_OTLP_HEADERS }}
    OTEL_EXPORTER_OTLP_PROTOCOL={{ .Values.api.env.OTEL_EXPORTER_OTLP_PROTOCOL }}
    OTEL_CONSOLE_ENABLED={{ .Values.api.env.OTEL_CONSOLE_ENABLED }}
    OTEL_FASTAPI_ENABLED={{ .Values.api.env.OTEL_FASTAPI_ENABLED }}
    OTEL_SQLALCHEMY_ENABLED={{ .Values.api.env.OTEL_SQLALCHEMY_ENABLED }}
    OTEL_MCP_ENABLED={{ .Values.api.env.OTEL_MCP_ENABLED }}

    # Evaluation concurrency
    MAX_CONCURRENT_EVALUATIONS={{ .Values.api.env.MAX_CONCURRENT_EVALUATIONS }}
    MAX_CONCURRENT_PROCESSING_TASKS_PER_EVALUATION={{ .Values.api.env.MAX_CONCURRENT_PROCESSING_TASKS_PER_EVALUATION }}
    EVALUATION_ITEM_PROCESSING_TASK_TIMEOUT_MINUTES={{ .Values.api.env.EVALUATION_ITEM_PROCESSING_TASK_TIMEOUT_MINUTES }}
